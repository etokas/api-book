services:
  php:
    build: docker/php
    volumes:
      - ./:/app
    networks:
      - default
    depends_on:
      - db

  db:
    image: postgres:17.6-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: symfony
      POSTGRES_USER: symfony
      POSTGRES_PASSWORD: symfony
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default

  nginx:
    image: nginx:latest
    volumes:
      - ./:/app:ro
      - ./docker/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    networks:
      - default

volumes:
  postgres_data:

networks:
  default:
